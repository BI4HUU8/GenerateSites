<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тестова сторінка</title>
<meta name="description" content="Створено з адмінки">
<style>
  body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1b1f24;background:#fff}
  main{max-width:720px;margin:0 auto;padding:56px 20px}
  h1{font-size:32px;line-height:1.2;margin:0 0 18px}
  p{color:#3d4653}
  footer{margin-top:48px;font-size:13px;color:#8b93a3}
</style>
</head>
<body>
<main>
<h1>Тестова сторінка</h1>
<p>Якщо ви бачите цю сторінку — адмінка працює.</p>
<p>Час створення: <strong id="stamp"></strong></p>
<script>document.getElementById('stamp').textContent = new Date().toLocaleString('uk-UA');</script>
<footer>Оновлено: 2026-11-28 01:00 UTC</footer>
</main>
</body>
</html>
