<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальний WebP конвертер 500x500</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f9;
            color: #333;
        }
        .drop-zone {
            border: 3px dashed #6c63ff;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            background: #fff;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .drop-zone.dragover {
            background: #eef0ff;
            border-color: #3f3d56;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .gallery-item {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        .file-info {
            font-size: 12px;
            margin: 10px 0;
            color: #666;
            word-break: break-all;
        }
        .download-btn {
            display: inline-block;
            background: #6c63ff;
            color: #fff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background: #574fd6;
        }
    </style>
</head>
<body>

    <div class="drop-zone" id="dropZone">
        <p>Перетягніть фото сюди або натисніть для вибору<br>
        <small style="color: #666;">Автоматична конвертація у .webp (500×500 px)</small></p>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');

        const TARGET_SIZE = 500; // Цільовий розмір у пікселях
        const WEBP_QUALITY = 0.85; // Якість стиснення від 0.1 до 1.0

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                processImage(file);
            }
        }

        function processImage(file) {
            const tempUrl = URL.createObjectURL(file);
            const img = new Image();

            img.onload = () => {
                // Звільняємо пам'ять від вихідного файлу
                URL.revokeObjectURL(tempUrl);

                // Створюємо полотно 500x500
                const canvas = document.createElement('canvas');
                canvas.width = TARGET_SIZE;
                canvas.height = TARGET_SIZE;
                const ctx = canvas.getContext('2d');

                // Вираховуємо квадратну область по центру, щоб фото не сплющилось
                const minSide = Math.min(img.width, img.height);
                const startX = (img.width - minSide) / 2;
                const startY = (img.height - minSide) / 2;

                // Малюємо обрізане та масштабоване фото на полотні
                ctx.drawImage(
                    img,
                    startX, startY, minSide, minSide,
                    0, 0, TARGET_SIZE, TARGET_SIZE
                );

                // Конвертуємо полотно у формат WebP
                canvas.toBlob((blob) => {
                    if (!blob) return;

                    const webpUrl = URL.createObjectURL(blob);
                    const newFileName = file.name.replace(/\.[^/.]+$/, "") + "_500x500.webp";
                    const sizeKB = (blob.size / 1024).toFixed(1);

                    renderCard(webpUrl, newFileName, sizeKB);
                }, 'image/webp', WEBP_QUALITY);
            };

            img.src = tempUrl;
        }

        function renderCard(url, fileName, sizeKB) {
            const item = document.createElement('div');
            item.className = 'gallery-item';

            const preview = document.createElement('img');
            preview.src = url;
            preview.alt = fileName;

            const info = document.createElement('div');
            info.className = 'file-info';
            info.textContent = `${fileName} (${sizeKB} КБ)`;

            const downloadBtn = document.createElement('a');
            downloadBtn.href = url;
            downloadBtn.download = fileName;
            downloadBtn.className = 'download-btn';
            downloadBtn.textContent = 'Завантажити .webp';

            item.appendChild(preview);
            item.appendChild(info);
            item.appendChild(downloadBtn);
            gallery.appendChild(item);
        }
    </script>
</body>
</html>
